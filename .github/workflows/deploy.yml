name: Deploy

# Deploys site/ to the chd-ds-web-main Azure Static Web App (datascience.unocha.org).
# Production only: the job runs for main, not for a branch or a pull request. An edited
# copy of this file on a branch could still try, so the token is meant to be an
# environment secret of `production`, whose deployment branches are limited to main
# (see README).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key is set
        id: key
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet, so nothing was deployed."
            echo "set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.key.outputs.set == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
