name: Deploy

# Deploys the main app of datascience.unocha.org (the chd-ds-web-main Azure Static Web App):
# site/ at the root, and the AA tracker's open site at /aa-tracker/, put together by
# scripts/assemble.py (see README).
# The file keeps the name Azure gave it (after the app's default hostname). The app's
# deployment authorization policy is Deployment token, so the token alone is enough.
# Production only: the deploy job runs for main, not for a branch or a pull request. An edited
# copy of this file on a branch could still try, so the token is an environment secret
# of `production`, whose deployment branches are limited to main (see README).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/azure-static-web-apps-orange-coast-043ccba0f.yml"
  # every 30 minutes: deploys only when the AA tracker's open site has changed
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  # for the tracker's publish workflow, if it is later given a way to start this one
  repository_dispatch:
    types: [aa-tracker-published]

permissions:
  contents: read

# one at a time; a waiting run is replaced by a newer one
concurrency:
  group: deploy-main-app
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.assemble.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Put the site together
        id: assemble
        run: python3 scripts/assemble.py --out _site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: assemble
    # a scheduled run deploys only when the tracker changed; any other run always deploys
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || needs.assemble.outputs.changed == 'true')
    environment: production
    runs-on: ubuntu-latest
    steps:
      # A missing token fails the run, so a deploy that didn't happen never shows as green.
      - name: Check the deploy key is set
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The environment secret AZURE_STATIC_WEB_APPS_API_TOKEN (environment production) is not set, so nothing was deployed. See README."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          output_location: ""
          skip_app_build: true
          skip_api_build: true
